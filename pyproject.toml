[project]
name = "draiver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nathan-real", email = "nadelmard@ensc.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "torch>=2.11.0",
    "vgamepad>=0.2.0",
]

[project.scripts]
draiver = "draiver:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
