[project]
name = "draiver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nathan-real", email = "nadelmard@ensc.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "vgamepad>=0.2.0",
]

[project.scripts]
draiver = "draiver:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
